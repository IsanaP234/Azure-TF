
name: Terraform Destroy - Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select environment to destroy
        required: true
        type: choice
        options:
          - dev
          - preprod
          - prod

      confirm_destroy:
        description: Type DESTROY to confirm
        required: true
        type: string

permissions:
  id-token: write
  contents: read

# Use the same concurrency group as your CD workflow
# to prevent simultaneous apply/destroy operations.
concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest

    # Uses your existing GitHub environments and their protection rules.
    environment: ${{ inputs.environment }}

    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Validate destroy confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "Invalid confirmation. Type DESTROY to proceed."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Azure Login using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ inputs.environment }}.tfstate"

      - name: Terraform Validate
        run: terraform validate

      - name: Generate Destroy Plan
        run: |
          terraform plan \
            -destroy \
            -input=false \
            -lock-timeout=5m \
            -var-file="tfvars/${{ inputs.environment }}.tfvars" \
            -out=tfplan

      - name: Execute Destroy
        run: |
          terraform apply \
            -input=false \
            -lock-timeout=5m \
            tfplan
